[pytest]
# The suites are named *_test_suite.py, which does not match pytest's default
# discovery patterns (test_*.py, *_test.py).  Without this, "pytest tests/"
# silently collects nothing.
python_files = *_test_suite.py test_*.py
testpaths = tests
markers =
    slow: slower algorithm coverage tests (set RUN_SLOW=1 to enable)
